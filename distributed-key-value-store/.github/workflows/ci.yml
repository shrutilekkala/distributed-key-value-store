name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: ./build/cppkv_tests

      - name: Smoke test server + client
        run: |
          ./build/cppkv_server --port 7000 --threads 4 --aof ci.aof &
          SERVER_PID=$!
          sleep 1
          printf "SET foo bar\nGET foo\nPING\nquit\n" | ./build/cppkv_client --port 7000
          kill -INT $SERVER_PID
          wait $SERVER_PID || true
